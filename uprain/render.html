</head><body><canvas id="c"></canvas>
<script type="module">
import { createUprainScene } from './js/uprain3d.js';

  light: q.get('light') || 'hielo', preserve: true, dpr: num('dpr', 1), anchorX: num('ax', 0.5),
  fill: q.get('fill') ? +q.get('fill') : null, yaw: num('yaw', 0), rate: num('rate', -0.55), strobe: q.get('strobe') !== '0',
  mist: q.get('mist') !== '0', floor: q.get('floor') !== '0', bloom: num('bloom', 1),
});
setTimeout(() => { document.title = 'ready'; }, 400);
</script></body></html>
