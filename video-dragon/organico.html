<style>

  @font-face { font-family: Anton; src: url(fonts/anton.woff2) format("woff2"); }

  #ui { position: absolute; inset: 0; pointer-events: none; }
  /* captions in the reference's style: clean white sans, one word or two at a time, and the key words stacked

  @font-face { font-family: Inter; src: url(fonts/inter-tight.woff2) format("woff2"); font-weight: 600 800; }
  @font-face { font-family: Serif; src: url(fonts/instrument-italic.woff2) format("woff2"); font-style: italic; }

  #cap .small { font: 700 62px/1 Inter, sans-serif; letter-spacing: -0.045em; }
  #cap .serif { font: italic 400 210px/0.78 Serif, serif; letter-spacing: -0.035em; margin-top: -0.06em; }

  #cap .mint { color: #3fe3c2; text-shadow: 0 0 26px rgba(63,227,194,.5), 0 2px 14px rgba(0,0,0,.35); }
  #cap .multi { font: 800 104px/0.86 Inter, sans-serif; letter-spacing: -0.05em; }

  .box { position: absolute; left: 50%; transform: translateX(-50%); padding: 14px 30px 18px; border-radius: 22px; background: #fff; color: #111; font: 700 56px/1.15 Manrope, sans-serif; white-space: nowrap; opacity: 0; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
