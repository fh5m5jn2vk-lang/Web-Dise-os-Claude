<style>
  @font-face { font-family: Geist; src: url(../fonts/geist.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: GeistMono; src: url(../fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: Han; src: url(../fonts/han.woff2) format("woff2"); font-weight: 900; }
  html, body { margin: 0; overflow: hidden; background: #ebe8e3; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ebe8e3; font-family: Geist, sans-serif; color: #111; }
  #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1010px; }
  #shape { position: absolute; overflow: hidden; }
  .lay { position: absolute; left: 50%; top: 50%; opacity: 0; }
  /* captions */
  #cap { position: absolute; left: 80px; right: 80px; top: 230px; font: 650 62px/1.1 Geist, sans-serif; letter-spacing: -0.04em; }
  #cap span { display: inline-block; margin-right: .22em; }

  #brand i { font: 900 22px Han, serif; font-style: normal; color: #fff; background: #e5322d; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  /* cursor */
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; transform-origin: 6px 4px; }
  /* bits of UI */
  .row { display: flex; align-items: center; }
  .mono { font-family: GeistMono, monospace; }
  .logo { width: 56px; height: 56px; border-radius: 15px; background: #e5322d; color: #fff; display: grid; place-items: center; font: 900 34px Han, serif; flex: none; }
  .media { position: absolute; overflow: hidden; background: #f3f1ee; }
  .media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .media canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { position: absolute; height: 8px; border-radius: 4px; background: #e2ded8; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #111; }
  .knob { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #111; margin: -9px 0 0 -13px; }
  .tab { position: absolute; top: 0; height: 100%; display: grid; place-items: center; font: 600 30px Geist; letter-spacing: -0.03em; }
  .tab b { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 10px; vertical-align: 1px; }
  .item { position: absolute; left: 24px; right: 24px; height: 64px; border-radius: 14px; display: flex; align-items: center; padding: 0 18px; font: 500 30px Geist; letter-spacing: -0.03em; box-sizing: border-box; }
  .item small { margin-left: auto; font: 500 24px GeistMono; color: #8d877f; }
