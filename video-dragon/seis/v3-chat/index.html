<style>
  @font-face { font-family: Inter; src: url(../fonts/inter.woff2) format("woff2"); font-weight: 200 900; }
  @font-face { font-family: Anton; src: url(../fonts/anton.woff2) format("woff2"); }
  @font-face { font-family: Han; src: url(../fonts/han.woff2) format("woff2"); font-weight: 900; }
  html, body { margin: 0; overflow: hidden; background: #0b0e14; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0e14; font-family: Inter, "Noto Color Emoji", sans-serif; color: #eef1f6; }
  #app { position: absolute; inset: 0; transform-origin: 540px 960px; }
  #wall { position: absolute; left: 0; right: 0; top: 232px; bottom: 236px; background: #0e121a; overflow: hidden; }
  #wall svg { position: absolute; inset: 0; opacity: .07; }
  #chat { position: absolute; left: 0; right: 0; top: 0; }
  .msg { position: absolute; left: 0; right: 0; opacity: 0; }
  .bub { position: absolute; border-radius: 34px; padding: 22px 30px 26px; font: 500 46px/1.26 Inter, "Noto Color Emoji"; letter-spacing: -0.02em; max-width: 760px; box-sizing: border-box; }
  .them .bub { left: 118px; background: #1f2430; border-bottom-left-radius: 10px; }
  .me .bub { right: 36px; background: #5b47f5; border-bottom-right-radius: 10px; }
  .who { font: 700 28px Inter; margin-bottom: 6px; letter-spacing: -0.01em; }
  .ava { position: absolute; left: 30px; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font: 700 32px Inter; color: #fff; }
  .meta { font: 500 24px Inter; color: rgba(255,255,255,.55); margin-top: 8px; text-align: right; }
  .w { transition: none; }
  .voice { display: flex; align-items: center; gap: 22px; width: 600px; }
  .voice .pb { width: 76px; height: 76px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
  .voice .wf { display: flex; align-items: center; gap: 5px; height: 70px; flex: 1; }
  .voice .wf i { display: block; width: 6px; border-radius: 3px; background: rgba(255,255,255,.35); }
  .tr { font: 500 38px/1.3 Inter, "Noto Color Emoji"; margin-top: 14px; color: rgba(255,255,255,.92); letter-spacing: -0.02em; }
  .vid { width: 560px; height: 720px; border-radius: 26px; overflow: hidden; position: relative; background: #000; margin: -8px -16px -6px; }
  .vid canvas { width: 100%; height: 100%; display: block; }
  .vid .dur { position: absolute; left: 18px; bottom: 16px; font: 600 26px Inter; background: rgba(0,0,0,.5); border-radius: 12px; padding: 4px 12px; }
  .react { position: absolute; bottom: -34px; background: #2a3040; border: 4px solid #0e121a; border-radius: 30px; padding: 4px 14px; font: 36px "Noto Color Emoji"; }
  .typing { position: absolute; left: 118px; background: #1f2430; border-radius: 34px; border-bottom-left-radius: 10px; width: 150px; height: 90px; display: flex; align-items: center; justify-content: center; gap: 12px; opacity: 0; }
  .typing i { width: 16px; height: 16px; border-radius: 50%; background: #9aa3b5; display: block; }
  .card { width: 640px; margin: -8px -16px -6px; border-radius: 26px; overflow: hidden; background: #262c3a; }
  .card img { width: 100%; height: 420px; object-fit: cover; display: block; }
  /* the hook: notifications on the lock screen */
  #lock { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 20%, #2a2257, #0b0e14 70%); }
  #lock .clock { position: absolute; top: 260px; left: 0; right: 0; text-align: center; font: 200 220px/1 Inter; letter-spacing: -0.04em; }
  #lock .date { position: absolute; top: 230px; left: 0; right: 0; text-align: center; font: 500 40px Inter; color: rgba(255,255,255,.8); }
  .note { position: absolute; left: 40px; right: 40px; height: 168px; border-radius: 40px; background: rgba(40,44,60,.82); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 26px; padding: 0 32px; box-sizing: border-box; opacity: 0; }
  .note .ic { width: 92px; height: 92px; border-radius: 24px; background: #5b47f5; display: grid; place-items: center; font: 50px "Noto Color Emoji"; flex: none; }
  .note b { display: block; font: 700 36px Inter; letter-spacing: -0.02em; }
  .note span { font: 500 36px Inter, "Noto Color Emoji"; color: rgba(255,255,255,.85); }
  .note em { position: absolute; right: 34px; top: 30px; font: 500 26px Inter; font-style: normal; color: rgba(255,255,255,.55); }
  /* the end sheet */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 1260px; background: #f5f3ef; color: #111; border-radius: 56px 56px 0 0; transform: translateY(1300px); box-shadow: 0 -40px 80px rgba(0,0,0,.4); }
</style>
</head>
