<style>@font-face { font-family: Marker; src: url(../fonts/marker.woff2) format("woff2"); } #scene { position: absolute; left: 0; top: 0; } #cap { top: 200px; font: 400 80px/1.25 Marker, sans-serif; letter-spacing: 0; } #cap .w { color: #1d1a2b; text-shadow: none; -webkit-text-stroke: 0; background: #fffdf6; box-shadow: 5px 7px 0 rgba(0,0,0,.35); border-radius: 2px; margin: 0 .1em .12em; } #cap .w.cur { background: #ffd43b; color: #1d1a2b; } #cap .w.k { color: #e0312b; } #cap .w.k.cur { background: #ffd43b; color: #e0312b; } .tag { background: #fffdf6; color: #1d1a2b; font: 400 64px/1 Marker; padding: 14px 26px 10px; box-shadow: 6px 9px 0 rgba(0,0,0,.35); white-space: nowrap; } .tag.red { background: #ff3b4e; color: #fff; } .tag.yel { background: #ffd43b; }</style>
