<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil del canal</title>
<style>
@font-face { font-family: Marker; src: url(marker.woff2) format("woff2"); }
@font-face { font-family: Bungee; src: url(bungee.woff2) format("woff2"); }
html, body { margin: 0; background: #fff; }
svg { display: block; }
</style></head><body>
<svg id="a" width="800" height="800" viewBox="0 0 800 800" style="display:none">
  <!-- A: amarillo, interrogación de rotulador negro y punto rojo -->
  <defs><filter id="rot"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter></defs>
  <rect width="800" height="800" fill="#ffd43b"/>
  <circle cx="400" cy="400" r="300" fill="#ffe57a"/>
  <g transform="rotate(-8 400 400)" filter="url(#rot)">
    <path d="M285 300 Q285 170 410 165 Q530 165 530 270 Q530 345 455 385 Q410 410 410 470" fill="none" stroke="#141414" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="412" cy="600" r="54" fill="#ff3b4e" stroke="#141414" stroke-width="14"/>
  </g>
  <g fill="#141414"><path d="M640 190 l14 34 l36 4 l-28 24 l9 36 l-31 -20 l-31 20 l9 -36 l-28 -24 l36 -4 Z" transform="rotate(12 655 240)"/></g>
</svg>
<svg id="b" width="800" height="800" viewBox="0 0 800 800" style="display:none">
  <!-- B: neón sobre fondo oscuro -->
  <defs><filter id="neon" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="fondo" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a1530"/><stop offset="1" stop-color="#0d0a12"/></radialGradient></defs>
  <rect width="800" height="800" fill="url(#fondo)"/>
  <g filter="url(#neon)" transform="rotate(-6 400 400)">
    <path d="M285 300 Q285 170 410 165 Q530 165 530 270 Q530 345 455 385 Q410 410 410 470" fill="none" stroke="#3ff5ff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M285 300 Q285 170 410 165 Q530 165 530 270 Q530 345 455 385 Q410 410 410 470" fill="none" stroke="#e9ffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="412" cy="600" r="52" fill="#ff4fd8"/><circle cx="412" cy="600" r="22" fill="#ffe3f8"/>
  </g>
</svg>
<svg id="c" width="800" height="800" viewBox="0 0 800 800" style="display:none">
  <!-- C: cómic, «?!» con trama de puntos -->
  <defs><pattern id="pt" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="7" fill="#ff7a8f"/></pattern></defs>
  <rect width="800" height="800" fill="#ff3b4e"/>
  <rect width="800" height="800" fill="url(#pt)" opacity=".55"/>
  <path d="M400 95 L455 250 L620 180 L540 330 L705 400 L540 470 L620 620 L455 550 L400 705 L345 550 L180 620 L260 470 L95 400 L260 330 L180 180 L345 250 Z" fill="#fff200" stroke="#141414" stroke-width="16" stroke-linejoin="round"/>
  <g transform="rotate(-8 400 410)">
    <text x="414" y="548" text-anchor="middle" font-family="Bungee" font-size="400" fill="#141414">?!</text>
    <text x="400" y="534" text-anchor="middle" font-family="Bungee" font-size="400" fill="#ffffff" stroke="#141414" stroke-width="16" paint-order="stroke">?!</text>
  </g>
</svg>
</body></html>
